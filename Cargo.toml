[package]
name = "hummingbird"
version = "0.4.0"
edition = "2024"
description = "Music Player"
license = "Apache-2.0"
readme = "README.md"
categories = ["multimedia::audio"]

[features]
runtime_shaders = ["gpui_platform/runtime_shaders"]
console = ["dep:console-subscriber", "tokio/tracing"]
# Use the system allocator so Heaptrack can observe Rust allocations, and avoid loading PipeWire
# concurrently with the GPU driver during startup.
heap-profileable = []
update = ["dep:semver", "dep:minisign-verify", "dep:winreg", "online"]
online = ["dep:zed-reqwest"]
libre-services = ["online"]
proprietary-services = ["online"]
default = ["libre-services", "proprietary-services"]

[dependencies]
anyhow = "1"
audioadapter-buffers = "5"
async-compression = { version = "0.4", features = ["zlib", "tokio"] }
async-trait = "0.1"
base64 = "0.23"
bitflags = "2"
camino = { version = "1", features = ["serde1"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
cntp_i18n = { version = "0.3", features = ["gpui"] }
console-subscriber = { version = "0.5", optional = true }
cpal = { version = "0.18.2", features = ["pipewire"] }
dateparser = "0.3"
derive_more = { version = "2", features = ["debug"] }
directories = "6"
discord-rich-presence = "1"
file-rotate = "0.8.0"
futures = "0.3"
globwalk = "0.9"
gpui = { package = "gpui-unofficial", git = "https://git.mailliw.org/hummingbird/gpui-unofficial-shim" }
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", features = ["wayland", "x11", "font-kit"] }
image = "0.25"
indexmap = { version = "2", features = ["serde"] }
infer = "0.22"
intx = "0.1"
itertools = "0.15"
lofty = "0.25"
md5 = "0.8"
mimalloc = { version = "0.1", features = ["no_thp"] }
minisign-verify = { version = "0.2", optional = true }
moka = { version = "0.12", features = ["sync"] }
notify = "8"
nucleo = "0.5"
open = "5"
palette = "0.7"
postcard = { version = "1", features = ["use-std"] }
rand = "0.10"
raw-window-handle = "0.6"
realfft = "3"
regex = "1"
rtrb = "0.3"
rubato = "5"
rust-embed = "8"
rustc-hash = "2"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", optional = true }
smallvec = "1"
sqlx = { version = "0.9", features = ["chrono", "runtime-tokio", "sqlite"] }
symphonia = { version = "0.6", features = ["all", "opt-simd"] }
symphonia-adapter-libopus = "0.3"
symphonia-adapter-fdk-aac = "0.2"
sysinfo = "0.39"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
url = "2.5"
urlencoding = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zed-reqwest = { version = "0.12.15-zed", default-features = false, optional = true, features = [
    "json",
    "macos-system-configuration",
    # this was native-roots, but this caused intermittent issues on Windows
    "rustls-tls-webpki-roots",
] }
notify-debouncer-full = "0.7.0"

[patch.crates-io]
gpui-unofficial = { git = "https://git.mailliw.org/hummingbird/gpui-unofficial-shim" }

[build-dependencies]
anyhow = "1"
cntp_i18n_gen = "0.3"
dotenvy = "0.15"
vergen = { version = "10", features = ["build"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Devices_Enumeration",
    "Foundation_Collections",
    "Media",
    "Media_Audio",
    "Media_MediaProperties",
    "Media_Render",
    "Storage_Search",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_WinRT",
    "Win32_System_Power",
    "Win32_System_Recovery"
] }
windows-future = "0.3"
windows-result = "0.4"
winreg = { version = "0.56", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
core-text = "=21.0.0" # GPUI issue, zed#47168
block2 = "0.6"
imagesize = "0.14"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSImage"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3", features = [
    "NSData",
    "NSDictionary",
    "NSProcessInfo",
    "NSValue",
] }
objc2-media-player = { version = "0.3", features = ["MPNowPlayingInfoCenter"] }

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.10"
zbus = "5"

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev-optimized]
inherits = "release"
debug = "full"
strip = "none"
lto = "none"
opt-level = "s"

[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"

[profile.release-distro]
inherits = "release"
codegen-units = 1
lto = "fat"
debug = "full"
split-debuginfo = "packed"
